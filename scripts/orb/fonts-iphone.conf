<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The app uses the device's system font (Tailwind's default stack), which
     renders as DejaVu Sans in an orb. Inter stands in for iOS's SF Pro, which
     can't be installed outside Apple devices. .agents/setup links this file
     into ~/.config/fontconfig/conf.d, so the orb renders like an iPhone by
     default; fonts-android.conf switches to Roboto. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
