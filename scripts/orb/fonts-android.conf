<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Renders the app like Android (Roboto) instead of the orb's iPhone default
     (fonts-iphone.conf). Use it for a single browser session:
     agent-browser close && FONTCONFIG_FILE="$PWD/scripts/orb/fonts-android.conf" agent-browser open <url>
     The system config also loads the iPhone rules; these come later and win. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Roboto</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Roboto</string></edit>
  </match>
</fontconfig>
